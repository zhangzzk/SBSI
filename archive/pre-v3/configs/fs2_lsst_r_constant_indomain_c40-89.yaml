# Paired OOD-removal experiment. Step 1 must be prepared with
# scripts/prepare_constgold_indomain.py so the existing case catalogues are filtered in place
# without resampling the in-domain galaxies.
catalog:
  type: fs2
  path: /project/ls-gruen/users/zekang.zhang/lsst_sims/FS2/FS2_25876/FS2_25876_IA_Griffith_UDF_i_25.feather
  mag_column: lsst_r_mag
  mag_cut: 28
  re_convention: circularized

simulation:
  output_path: /project/ls-gruen/users/zekang.zhang/lsst_sims_fs2_25876_constant_indomain
  base_config: /home/z/Zekang.Zhang/blendemu/configs/base_sim_config.ini
  n_cases: 50
  case_offset: 40
  pixel_scale: 0.2
  shear_mode: constant
  constant_shear: 0.02
  constant_shear_angle: 0.0
  constant_two_sided: true

noise:
  source: csv
  csv_path: /project/ls-gruen/users/zekang.zhang/lsst_sims/Euclid_Q1_median_LSST10yr.csv
  band: LSST_r

shape_measurement:
  stamp_size: 48
  pixel_scale: 0.2
  use_pos: detect
  tile_name: tile180.0_-0.5

catalogues:
  constant_shear:
    r_max: 3
    r_min: 0
    k: 2
    include_isolated: true
    shape_suffix: _all
    output_prefix: constant_shear_catalogue
    response_output_prefix: constant_response_catalogue
  batch_size: 10
  n_jobs: 32

training:
  model_dir: /home/z/Zekang.Zhang/blendemu/models
  model_tag: lsst_r
  rescale:
    pixel_rms: 0.312
    pixel_size: 0.2
    zero_mag: 30
    psf_fwhm: 0.73
    moffat_beta: 2.224

cluster:
  n_mpi: 100
  realizations: "d,0,1"
