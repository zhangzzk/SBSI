# Packaging for the SBSI shear-calibration library (`sbsi`).
#
# The repo runs under the conda env `sims1` with PYTHONPATH set (see CLAUDE.md); that
# remains the primary contract. This file additionally lets the library be installed
# editable so `import sbsi` and `from sbsi.response import flow_response` resolve
# without the per-script sys.path shim:
#
#     conda activate sims1 && pip install -e .   # optional; PYTHONPATH still works as before
#
# Runtime dependencies are provided by the conda env, so none are declared here (keeps
# `pip install -e .` from touching the shared env's package versions).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbsi"
version = "3.0.0"
description = "Simulation-based shear calibration with measurement flows and blending emulators."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sbsi = "sbsi.cli:main"

[tool.setuptools]
packages = ["sbsi"]

[tool.ruff]
line-length = 110
