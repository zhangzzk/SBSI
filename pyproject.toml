# Packaging for the SBSI shear-calibration library (`sbsi`).
#
# Install the checkout editable into the environment used by scripts and notebooks.
# This is the primary import contract; code must not depend on the shell or kernel's
# current working directory:
#
#     python -m pip install -e .

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbsi"
version = "3.0.0"
description = "Simulation-based shear calibration with measurement flows and blending emulators."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "PyYAML",
    "scipy",
    "torch",
]

[project.optional-dependencies]
notebook = ["ipykernel", "matplotlib"]
# BlendEMU itself is a source checkout with no dependency metadata (see
# sbsi/blendemu_checkout.py), so its import-time requirements are declared here.
blendemu = ["xgboost", "joblib"]

[project.scripts]
sbsi = "sbsi.cli:main"

[tool.setuptools]
packages = ["sbsi"]

[tool.ruff]
line-length = 110
