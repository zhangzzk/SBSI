# Diagnostic antithetic SELF-response leg for SBSI V2.1.
#
# This is the missing -g partner of the existing random-direction half-shear
# g=+0.02 cases 0..99.  The catalogue generator is deterministic in case seed,
# so +/- use identical galaxies, positions, random shear axes, and simulation
# noise; only the sign of every secondary's shear changes.  Primaries remain
# unsheared.  This permits a central-difference self-response without using the
# fixed-direction constgold acceptance catalogue.

catalog:
  type: fs2
  path: /project/ls-gruen/users/zekang.zhang/lsst_sims/FS2/FS2_25876/FS2_25876_IA_Griffith_UDF_i_25.feather
  mag_column: lsst_r_mag
  mag_cut: 29
  re_convention: circularized

simulation:
  output_path: /project/ls-gruen/users/zekang.zhang/lsst_sims_fs2_25876/
  base_config: /home/z/Zekang.Zhang/blendemu/configs/base_sim_config.ini
  case_offset: 0
  response:
    n_cases: 100
    shear_values: [-0.02]
  self_response:
    n_cases: 100
    shear_values: [-0.02]
  pixel_scale: 0.2

noise:
  source: csv
  csv_path: /project/ls-gruen/users/zekang.zhang/lsst_sims/Euclid_Q1_median_LSST10yr.csv
  band: LSST_r

shape_measurement:
  stamp_size: 48
  pixel_scale: 0.2
  use_pos: detect
  tile_name: tile180.0_-0.5

catalogues:
  response:
    r_max: 10
    k: 20
  self_response:
    r_max: 7
    k: 2
    shape_suffix: _secondaries
  detection:
    r_max: 7
    k: 2
  batch_size: 20
  n_jobs: 8

training:
  model_dir: /home/z/Zekang.Zhang/blendemu/models
  model_tag: lsst_r_antithetic_self_gm002
  rescale:
    pixel_rms: 0.312
    pixel_size: 0.2
    zero_mag: 30
    psf_fwhm: 0.73
    moffat_beta: 2.224

cluster:
  n_mpi: 100
  realizations: "d,0,1"
